server:
  address: 127.0.0.1
  port: 18080
spring:
  config:
    import: optional:file:./application-local.yaml
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      base-url: ${LAB_AGENT_BASE_URL:https://dashscope.aliyuncs.com}
      chat:
        options:
          model: ${LAB_AGENT_MODEL:qwen-plus}
  datasource:
    url: jdbc:mysql://127.0.0.1:3307/labdesk?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
    username: ${LAB_DB_USER:yudao}
    password: ${LAB_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 8
      minimum-idle: 1
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  sql:
    init:
      mode: always
      encoding: UTF-8
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: dev.labdesk.entity
  configuration:
    map-underscore-to-camel-case: true
ai:
  endpoint: ${LAB_AI_ENDPOINT:https://api.deepseek.com/chat/completions}
  model: ${LAB_AI_MODEL:deepseek-flash}
  key: ${LAB_AI_KEY:}
